<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" role="img" aria-label="TabICL-M architecture: three stages of TabICLv2 with the missing-aware column embedding and the reconstruction head added.">
  <style>svg{color:#1E2430;font-family:'IBM Plex Sans',Helvetica,Arial,sans-serif;background:#fff}  .box { fill: #fff; stroke: #1E2430; stroke-width: 1.2; }
  .box-new { fill: #D7EEEA; stroke: #0F766E; stroke-width: 1.6; }
  .stage { fill: #F3F5F7; stroke: #C9D1DA; stroke-width: 1; }
  .t { font-size: 12.5px; fill: #1E2430; }
  .t-b { font-size: 13px; fill: #1E2430; font-weight: 600; }
  .t-s { font-size: 11px; fill: #5B6675; }
  .t-m { font-size: 11px; fill: #1E2430; font-family: "IBM Plex Mono", Menlo, monospace; }
  .t-new { font-size: 12.5px; fill: #0F766E; font-weight: 600; }
  .t-stage { font-size: 14px; fill: #1E2430; font-weight: 600; }
  .edge { stroke: #1E2430; stroke-width: 1.2; fill: none; }
  .edge-new { stroke: #0F766E; stroke-width: 1.6; fill: none; }
  .edge-dash { stroke: #0F766E; stroke-width: 1.3; fill: none; stroke-dasharray: 4 3; }
  .cell { fill: #fff; stroke: #C9D1DA; stroke-width: .8; }
  .cell-miss { fill: #DEE3E9; stroke: #9AA5B4; stroke-width: .8; }
  .cell-hid { fill: #FDE9C9; stroke: #C98A1A; stroke-width: .8; }</style><defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E2430"/></marker>
    <marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/></marker>
  </defs>

  <!-- ===== input ===== -->
  <text x="20" y="30" class="t-stage">Input table X (B, T, H), NaN allowed</text>
  <text x="20" y="48" class="t-s">rows: train_size context rows with y, then test rows · columns: H features</text>
  <!-- mini table 6 rows x 5 cols -->
  <g transform="translate(20,60)">
    <text x="0" y="12" class="t-s">y</text>
    <text x="30" y="12" class="t-s">f1</text><text x="54" y="12" class="t-s">f2</text><text x="78" y="12" class="t-s">f3</text><text x="102" y="12" class="t-s">f4</text><text x="126" y="12" class="t-s">f5</text>
    <g transform="translate(0,18)">
      <rect x="0" y="0" width="18" height="12" class="cell"/><rect x="26" y="0" width="20" height="12" class="cell"/><rect x="50" y="0" width="20" height="12" class="cell"/><rect x="74" y="0" width="20" height="12" class="cell-miss"/><rect x="98" y="0" width="20" height="12" class="cell"/><rect x="122" y="0" width="20" height="12" class="cell"/>
      <rect x="0" y="15" width="18" height="12" class="cell"/><rect x="26" y="15" width="20" height="12" class="cell"/><rect x="50" y="15" width="20" height="12" class="cell-hid"/><rect x="74" y="15" width="20" height="12" class="cell-miss"/><rect x="98" y="15" width="20" height="12" class="cell"/><rect x="122" y="15" width="20" height="12" class="cell"/>
      <rect x="0" y="30" width="18" height="12" class="cell"/><rect x="26" y="30" width="20" height="12" class="cell-miss"/><rect x="50" y="30" width="20" height="12" class="cell"/><rect x="74" y="30" width="20" height="12" class="cell"/><rect x="98" y="30" width="20" height="12" class="cell"/><rect x="122" y="30" width="20" height="12" class="cell-miss"/>
      <rect x="0" y="45" width="18" height="12" class="cell"/><rect x="26" y="45" width="20" height="12" class="cell-miss"/><rect x="50" y="45" width="20" height="12" class="cell"/><rect x="74" y="45" width="20" height="12" class="cell"/><rect x="98" y="45" width="20" height="12" class="cell-hid"/><rect x="122" y="45" width="20" height="12" class="cell-miss"/>
      <line x1="-4" y1="60" x2="146" y2="60" stroke="#9AA5B4" stroke-dasharray="3 2"/>
      <rect x="0" y="64" width="18" height="12" class="cell-miss"/><rect x="26" y="64" width="20" height="12" class="cell"/><rect x="50" y="64" width="20" height="12" class="cell"/><rect x="74" y="64" width="20" height="12" class="cell-miss"/><rect x="98" y="64" width="20" height="12" class="cell"/><rect x="122" y="64" width="20" height="12" class="cell"/>
      <rect x="0" y="79" width="18" height="12" class="cell-miss"/><rect x="26" y="79" width="20" height="12" class="cell"/><rect x="50" y="79" width="20" height="12" class="cell"/><rect x="74" y="79" width="20" height="12" class="cell"/><rect x="98" y="79" width="20" height="12" class="cell"/><rect x="122" y="79" width="20" height="12" class="cell-miss"/>
    </g>
    <text x="156" y="30" class="t-s">train rows</text>
    <text x="156" y="95" class="t-s">test rows (y unknown)</text>
  </g>
  <g transform="translate(20,180)">
    <rect x="0" y="0" width="14" height="10" class="cell"/><text x="20" y="9" class="t-s">observed</text>
    <rect x="80" y="0" width="14" height="10" class="cell-miss"/><text x="100" y="9" class="t-s">missing (NaN)</text>
    <rect x="190" y="0" width="14" height="10" class="cell-hid"/><text x="210" y="9" class="t-s">hidden for reconstruction (training only)</text>
  </g>

  <!-- ===== Stage 1: column embedding ===== -->
  <rect x="20" y="215" width="1040" height="150" rx="6" class="stage"/>
  <text x="34" y="238" class="t-stage">Stage 1 · Column-wise embedding (ColEmbedding), one set transformer shared by all columns</text>

  <rect x="34" y="252" width="150" height="46" rx="4" class="box"/>
  <text x="109" y="271" text-anchor="middle" class="t-b">feature grouping</text>
  <text x="109" y="288" text-anchor="middle" class="t-s">3 features per token, circular</text>

  <rect x="204" y="252" width="170" height="46" rx="4" class="box-new"/>
  <text x="289" y="271" text-anchor="middle" class="t-new">split observed / missing</text>
  <text x="289" y="288" text-anchor="middle" class="t-s">NaN → 0, indicator m ∈ {0,1}</text>

  <rect x="394" y="252" width="190" height="46" rx="4" class="box"/>
  <text x="489" y="271" text-anchor="middle" class="t-b">in_linear(x) + mask_linear(m)</text>
  <text x="489" y="288" text-anchor="middle" class="t-s">mask_linear is new, zero-initialised</text>

  <rect x="604" y="252" width="230" height="46" rx="4" class="box"/>
  <text x="719" y="271" text-anchor="middle" class="t-b">set transformer · 3 induced blocks</text>
  <text x="719" y="288" text-anchor="middle" class="t-s">128 inducing points attend to training rows</text>

  <rect x="854" y="252" width="190" height="46" rx="4" class="box-new"/>
  <text x="949" y="271" text-anchor="middle" class="t-new">+ absence vector</text>
  <text x="949" y="288" text-anchor="middle" class="t-s">on missing cells · learned, zero-initialised</text>

  <path d="M184,275 L202,275" class="edge" marker-end="url(#a)"/>
  <path d="M374,275 L392,275" class="edge-new" marker-end="url(#an)"/>
  <path d="M584,275 L602,275" class="edge" marker-end="url(#a)"/>
  <path d="M834,275 L852,275" class="edge" marker-end="url(#a)"/>

  <!-- key padding mask arrow -->
  <path d="M289,298 L289,330 L719,330 L719,300" class="edge-dash" marker-end="url(#an)"/>
  <text x="330" y="320" class="t-new">key padding mask: tokens with all cells missing are not keys for the inducing points</text>
  <text x="330" y="341" class="t-s">column statistics come from observed cells only · guard: a column with no observed training cell keeps all keys</text>

  <text x="34" y="357" class="t-m">out: embeddings (B, T, H + C, E), E = 128, C = 4 reserved CLS slots</text>

  <path d="M170,190 L170,215" class="edge" marker-end="url(#a)"/>

  <!-- ===== Stage 2: row interaction ===== -->
  <rect x="20" y="385" width="1040" height="150" rx="6" class="stage"/>
  <text x="34" y="408" class="t-stage">Stage 2 · Row-wise interaction (RowInteraction), transformer over the H + C tokens of each row</text>

  <rect x="34" y="422" width="180" height="46" rx="4" class="box"/>
  <text x="124" y="441" text-anchor="middle" class="t-b">prepend 4 CLS tokens</text>
  <text x="124" y="458" text-anchor="middle" class="t-s">rotary position encoding</text>

  <rect x="234" y="422" width="200" height="46" rx="4" class="box"/>
  <text x="334" y="441" text-anchor="middle" class="t-b">2 self-attention blocks</text>
  <text x="334" y="458" text-anchor="middle" class="t-s">all tokens attend to all tokens</text>

  <rect x="454" y="418" width="250" height="56" rx="4" class="box"/>
  <text x="579" y="436" text-anchor="middle" class="t-b">last block</text>
  <text x="579" y="452" text-anchor="middle" class="t-s">inference: query = CLS tokens only</text>
  <text x="579" y="466" text-anchor="middle" class="t-s">training with reconstruction: query = all tokens</text>

  <rect x="724" y="410" width="156" height="34" rx="4" class="box-new"/>
  <text x="802" y="431" text-anchor="middle" class="t-new">feature tokens (B, T, H, E)</text>

  <rect x="900" y="410" width="144" height="34" rx="4" class="box-new"/>
  <text x="972" y="425" text-anchor="middle" class="t-new">recon_head: Linear(E, 3)</text>
  <text x="972" y="439" text-anchor="middle" class="t-s">values of the token's group</text>

  <rect x="724" y="456" width="156" height="34" rx="4" class="box"/>
  <text x="802" y="477" text-anchor="middle" class="t-b">CLS outputs (B, T, 4E)</text>

  <path d="M214,445 L232,445" class="edge" marker-end="url(#a)"/>
  <path d="M434,445 L452,445" class="edge" marker-end="url(#a)"/>
  <path d="M704,437 L722,428" class="edge-new" marker-end="url(#an)"/>
  <path d="M704,455 L722,470" class="edge" marker-end="url(#a)"/>
  <path d="M880,427 L898,427" class="edge-new" marker-end="url(#an)"/>

  <text x="34" y="512" class="t-new">reconstruction loss: smooth-L1 on hidden cells only, weight 0.1</text>
  <text x="34" y="527" class="t-s">never on cells that were NaN in the table · head dropped at inference · CLS outputs are identical with either query set</text>

  <path d="M540,365 L540,385" class="edge" marker-end="url(#a)"/>

  <!-- ===== Stage 3: ICL ===== -->
  <rect x="20" y="555" width="1040" height="90" rx="6" class="stage"/>
  <text x="34" y="578" class="t-stage">Stage 3 · Dataset-wise in-context learning (ICLearning), unchanged</text>
  <rect x="34" y="592" width="250" height="40" rx="4" class="box"/>
  <text x="159" y="609" text-anchor="middle" class="t-b">add label embedding to train rows</text>
  <text x="159" y="625" text-anchor="middle" class="t-s">d_model = 4·E = 512</text>
  <rect x="304" y="592" width="300" height="40" rx="4" class="box"/>
  <text x="454" y="609" text-anchor="middle" class="t-b">12 transformer blocks over rows</text>
  <text x="454" y="625" text-anchor="middle" class="t-s">test rows attend to train rows only</text>
  <rect x="624" y="592" width="250" height="40" rx="4" class="box"/>
  <text x="749" y="609" text-anchor="middle" class="t-b">head → class logits or 999 quantiles</text>
  <text x="749" y="625" text-anchor="middle" class="t-s">task loss: cross-entropy or pinball</text>
  <path d="M284,612 L302,612" class="edge" marker-end="url(#a)"/>
  <path d="M604,612 L622,612" class="edge" marker-end="url(#a)"/>
  <path d="M802,490 L802,545 L749,545 L749,590" class="edge" marker-end="url(#a)"/>

  <!-- total loss -->
  <rect x="894" y="592" width="150" height="40" rx="4" class="box-new"/>
  <text x="969" y="609" text-anchor="middle" class="t-new">total loss</text>
  <text x="969" y="625" text-anchor="middle" class="t-s">task + 0.1 · reconstruction</text>
  <path d="M874,612 L892,612" class="edge" marker-end="url(#a)"/>
  <path d="M972,444 L972,590" class="edge-new" marker-end="url(#an)"/>

  <!-- legend -->
  <rect x="20" y="665" width="14" height="14" class="box-new"/><text x="40" y="676" class="t-s">new in TabICL-M (parameters start at zero, so complete data gives the TabICLv2 output)</text>
  <rect x="520" y="665" width="14" height="14" class="box"/><text x="540" y="676" class="t-s">TabICLv2, unchanged</text>
  <text x="700" y="676" class="t-s">B tables · T rows · H features · E = 128</text>
</svg>